name: Radar V10 frontend build
on:
  push:
    branches:
      - integration/radar-v10-20261017
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "packages/contracts/**"
      - "scripts/**"
      - "package*.json"
      - "tsconfig.json"
      - "vite.config.*"
      - ".github/workflows/frontend-build.yml"
permissions:
  contents: read
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify migration, TypeScript and Vite build
        run: npm run build
      - name: Package offline review bundle
        run: |
          cp -R dist dist-review
          test -s dist-review/index.html
          test -s dist-review/data/iran-provinces.geojson
      - name: Upload visual-review artifact
        uses: actions/upload-artifact@v4
        with:
          name: radar-v10-frontend-review
          path: dist-review/
          retention-days: 7
