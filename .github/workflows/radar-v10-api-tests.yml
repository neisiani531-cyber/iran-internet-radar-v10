name: Radar V10 API tests

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/api/**"
      - "packages/contracts/**"
      - ".github/workflows/radar-v10-api-tests.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/contracts/**"
      - ".github/workflows/radar-v10-api-tests.yml"

permissions:
  contents: read

jobs:
  python-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate shared public data contract
        working-directory: .
        run: |
          python packages/contracts/validate_snapshot.py
          python packages/contracts/validate_mobile.py
          python packages/contracts/validate_research.py
          python packages/contracts/validate_p01_registry.py
          python packages/contracts/validate_qos.py
      - name: Install API and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run API tests
        run: python -m pytest -q
